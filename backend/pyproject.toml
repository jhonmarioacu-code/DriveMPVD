[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "drivempvd-backend"
version = "0.1.0"
description = "Backend del gestor personal de archivos DriveMPVD"
requires-python = ">=3.13,<3.15"
dependencies = [
  "alembic>=1.16,<2.0",
  "argon2-cffi>=25.1,<26.0",
  "asyncpg>=0.30,<1.0",
  "fastapi>=0.116,<1.0",
  "pydantic-settings>=2.10,<3.0",
  "pyjwt>=2.10,<3.0",
  "python-dotenv>=1.1,<2.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "black>=25.1,<27.0",
  "httpx>=0.28,<1.0",
  "mypy>=1.17,<3.0",
  "pip-audit>=2.10,<3.0",
  "pip-tools>=7.5,<8.0",
  "pytest>=8.4,<10.0",
  "pytest-asyncio>=1.1,<2.0",
  "pytest-cov>=6.2,<8.0",
  "ruff>=0.12,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
src = ["app", "tests"]
target-version = "py313"

[tool.ruff.lint]
select = [
  "ASYNC",
  "B",
  "C4",
  "DTZ",
  "E",
  "F",
  "G",
  "I",
  "LOG",
  "PIE",
  "PT",
  "RET",
  "RUF",
  "SIM",
  "TID",
  "UP",
  "W",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=app",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=90",
]
asyncio_mode = "auto"
markers = ["postgresql: requires a real PostgreSQL 16 instance"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  '\.\.\.',
]
fail_under = 90
show_missing = true
