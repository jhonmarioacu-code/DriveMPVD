location = /__nginx_health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# Use Docker's embedded DNS at request time; nginx.conf.template defines the
# resolver. This keeps proxying healthy after an API or frontend recreation.
set $drivempvd_api_upstream api:8000;
set $drivempvd_frontend_upstream frontend:8080;

# Reserved for the existing DownloadDeliveryProvider X-Accel adapter. It is
# inaccessible from the public network and stays unused while application
# streaming is active.
location ^~ /_drivempvd_internal_storage/ {
    internal;
    alias /data/storage/;
    sendfile on;
}

location ~ ^/api/v1/auth/login/?$ {
    limit_req zone=login burst=5 nodelay;
    include /etc/nginx/includes/proxy-headers.conf;
    proxy_pass http://$drivempvd_api_upstream;
}

location ~ ^/api/v1/auth/refresh/?$ {
    limit_req zone=refresh burst=10 nodelay;
    include /etc/nginx/includes/proxy-headers.conf;
    proxy_pass http://$drivempvd_api_upstream;
}

# Chunks are written as a stream. Do not buffer them to disk before FastAPI
# receives them, and keep the timeouts aligned with large resumable uploads.
location ^~ /api/v1/storage/uploads/ {
    limit_req zone=api burst=60 nodelay;
    limit_conn uploads_per_ip 2;
    client_body_timeout 120s;
    include /etc/nginx/includes/proxy-headers.conf;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_pass http://$drivempvd_api_upstream;
}

# Preserve Range and conditional requests without proxy buffering so native
# audio, video and PDF controls can stream large files incrementally.
location ~ ^/api/v1/storage/files/[0-9A-Fa-f-]+/content$ {
    limit_conn per_ip 8;
    include /etc/nginx/includes/proxy-headers.conf;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_pass http://$drivempvd_api_upstream;
}

location /api/ {
    limit_req zone=api burst=60 nodelay;
    include /etc/nginx/includes/proxy-headers.conf;
    proxy_pass http://$drivempvd_api_upstream;
}

# Do not expose production source maps even if a future frontend build emits
# them by mistake.
location ~* \.map$ {
    access_log off;
    log_not_found off;
    return 404;
}

location / {
    include /etc/nginx/includes/proxy-headers.conf;
    proxy_pass http://$drivempvd_frontend_upstream;
}
