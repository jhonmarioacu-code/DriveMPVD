x-api-build: &api-build
  context: .
  dockerfile: docker/backend.Dockerfile

x-logging: &logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

x-backend-runtime: &backend-runtime
  env_file:
    - ${DRIVEMPVD_COMPOSE_ENV_FILE:-./docker/.env}
  environment:
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONUNBUFFERED: "1"
  networks:
    - private
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  user: "10001:10001"

services:
  postgres-init:
    image: drivempvd-postgres:${DRIVEMPVD_IMAGE_TAG:-local}
    user: "0:0"
    mem_limit: ${DRIVEMPVD_POSTGRES_INIT_MEMORY_LIMIT:-128m}
    mem_reservation: ${DRIVEMPVD_POSTGRES_INIT_MEMORY_RESERVATION:-32m}
    cpus: ${DRIVEMPVD_POSTGRES_INIT_CPU_LIMIT:-0.25}
    pids_limit: ${DRIVEMPVD_POSTGRES_INIT_PIDS_LIMIT:-64}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        install -d -m 0700 -o 70 -g 70 /var/lib/postgresql/data
        install -d -m 0700 -o 70 -g 70 /var/lib/postgresql/data/pgdata
        if [ "$(stat -c '%u:%g' /var/lib/postgresql/data)" != "70:70" ] || \
           [ "$(stat -c '%u:%g' /var/lib/postgresql/data/pgdata)" != "70:70" ]; then
          chown -R 70:70 /var/lib/postgresql/data
        fi
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    restart: "no"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  postgres:
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
    image: drivempvd-postgres:${DRIVEMPVD_IMAGE_TAG:-local}
    env_file:
      - ${DRIVEMPVD_COMPOSE_ENV_FILE:-./docker/.env}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB in docker/.env}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER in docker/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in docker/.env}
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1 || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - private
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    user: "70:70"
    mem_limit: ${DRIVEMPVD_POSTGRES_MEMORY_LIMIT:-4g}
    mem_reservation: ${DRIVEMPVD_POSTGRES_MEMORY_RESERVATION:-1g}
    cpus: ${DRIVEMPVD_POSTGRES_CPU_LIMIT:-1.25}
    pids_limit: ${DRIVEMPVD_POSTGRES_PIDS_LIMIT:-256}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=70,gid=70,mode=1777
      - /run/postgresql:rw,nosuid,nodev,size=1m,uid=70,gid=70,mode=3777
    restart: unless-stopped
    logging: *logging
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    image: drivempvd-api:${DRIVEMPVD_IMAGE_TAG:-local}
    <<: *backend-runtime
    command: ["alembic", "upgrade", "head"]
    mem_limit: ${DRIVEMPVD_MIGRATE_MEMORY_LIMIT:-1g}
    mem_reservation: ${DRIVEMPVD_MIGRATE_MEMORY_RESERVATION:-256m}
    cpus: ${DRIVEMPVD_MIGRATE_CPU_LIMIT:-1.0}
    pids_limit: ${DRIVEMPVD_MIGRATE_PIDS_LIMIT:-256}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: *api-build
    image: drivempvd-api:${DRIVEMPVD_IMAGE_TAG:-local}
    <<: *backend-runtime
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "${DRIVEMPVD_API_WORKERS:-2}"]
    mem_limit: ${DRIVEMPVD_API_MEMORY_LIMIT:-2g}
    mem_reservation: ${DRIVEMPVD_API_MEMORY_RESERVATION:-512m}
    cpus: ${DRIVEMPVD_API_CPU_LIMIT:-2.0}
    pids_limit: ${DRIVEMPVD_API_PIDS_LIMIT:-512}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=3).status == 200",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    logging: *logging
    volumes:
      - type: bind
        source: ${DRIVEMPVD_STORAGE_PATH:?Define DRIVEMPVD_STORAGE_PATH in docker/.env}
        target: /data/storage
        bind:
          create_host_path: false

  worker:
    image: drivempvd-api:${DRIVEMPVD_IMAGE_TAG:-local}
    <<: *backend-runtime
    command: ["python", "-m", "app.infrastructure.cli.process_storage_outbox"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      DRIVEMPVD_DATABASE_POOL_SIZE: "1"
      DRIVEMPVD_DATABASE_MAX_OVERFLOW: "0"
    mem_limit: ${DRIVEMPVD_WORKER_MEMORY_LIMIT:-512m}
    mem_reservation: ${DRIVEMPVD_WORKER_MEMORY_RESERVATION:-128m}
    cpus: ${DRIVEMPVD_WORKER_CPU_LIMIT:-0.5}
    pids_limit: ${DRIVEMPVD_WORKER_PIDS_LIMIT:-256}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /tmp/drivempvd-storage-outbox.heartbeat && test $$(( $$(date +%s) - $$(stat -c %Y /tmp/drivempvd-storage-outbox.heartbeat) )) -lt 30",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    logging: *logging
    volumes:
      - type: bind
        source: ${DRIVEMPVD_STORAGE_PATH:?Define DRIVEMPVD_STORAGE_PATH in docker/.env}
        target: /data/storage
        bind:
          create_host_path: false

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_CSRF_COOKIE_NAME: ${VITE_CSRF_COOKIE_NAME:-drivempvd_csrf}
        VITE_CSRF_HEADER_NAME: ${VITE_CSRF_HEADER_NAME:-X-CSRF-Token}
    image: drivempvd-frontend:${DRIVEMPVD_IMAGE_TAG:-local}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks:
      - edge
    mem_limit: ${DRIVEMPVD_FRONTEND_MEMORY_LIMIT:-256m}
    mem_reservation: ${DRIVEMPVD_FRONTEND_MEMORY_RESERVATION:-64m}
    cpus: ${DRIVEMPVD_FRONTEND_CPU_LIMIT:-0.25}
    pids_limit: ${DRIVEMPVD_FRONTEND_PIDS_LIMIT:-128}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    user: "101:101"
    restart: unless-stopped
    logging: *logging

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: drivempvd-nginx:${DRIVEMPVD_IMAGE_TAG:-local}
    env_file:
      - ${DRIVEMPVD_COMPOSE_ENV_FILE:-./docker/.env}
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1/__nginx_health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks:
      - edge
      - private
    ports:
      - "${DRIVEMPVD_HTTP_PORT:-8080}:80"
      - "${DRIVEMPVD_HTTPS_PORT:-8443}:443"
    restart: unless-stopped
    logging: *logging
    mem_limit: ${DRIVEMPVD_NGINX_MEMORY_LIMIT:-512m}
    mem_reservation: ${DRIVEMPVD_NGINX_MEMORY_RESERVATION:-128m}
    cpus: ${DRIVEMPVD_NGINX_CPU_LIMIT:-0.5}
    pids_limit: ${DRIVEMPVD_NGINX_PIDS_LIMIT:-256}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    volumes:
      - type: bind
        source: ${DRIVEMPVD_TLS_CERTIFICATES_PATH:-./docker/certificates}
        target: /etc/nginx/tls
        read_only: true
      - type: bind
        source: ${DRIVEMPVD_ACME_WEBROOT_PATH:-./docker/acme-webroot}
        target: /var/www/certbot
        read_only: true

networks:
  edge:
  private:
    internal: true

volumes:
  postgres_data:
