x-api-build: &api-build
  context: .
  dockerfile: docker/backend.Dockerfile

x-backend-runtime: &backend-runtime
  env_file:
    - ./docker/.env
  environment:
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONUNBUFFERED: "1"
  networks:
    - private
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  user: "10001:10001"

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - ./docker/.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB in docker/.env}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER in docker/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in docker/.env}
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1 || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - private
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    build: *api-build
    image: drivempvd-api:${DRIVEMPVD_IMAGE_TAG:-local}
    <<: *backend-runtime
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: *api-build
    image: drivempvd-api:${DRIVEMPVD_IMAGE_TAG:-local}
    <<: *backend-runtime
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=3).status == 200",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${DRIVEMPVD_STORAGE_PATH:?Define DRIVEMPVD_STORAGE_PATH in docker/.env}
        target: /data/storage
        bind:
          create_host_path: false

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_CSRF_COOKIE_NAME: ${VITE_CSRF_COOKIE_NAME:-drivempvd_csrf}
        VITE_CSRF_HEADER_NAME: ${VITE_CSRF_HEADER_NAME:-X-CSRF-Token}
    image: drivempvd-frontend:${DRIVEMPVD_IMAGE_TAG:-local}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks:
      - edge
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    user: "101:101"
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: drivempvd-nginx:${DRIVEMPVD_IMAGE_TAG:-local}
    env_file:
      - ./docker/.env
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1/__nginx_health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks:
      - edge
      - private
    ports:
      - "${DRIVEMPVD_HTTP_PORT:-8080}:80"
      - "${DRIVEMPVD_HTTPS_PORT:-8443}:443"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: ${DRIVEMPVD_TLS_CERTIFICATES_PATH:-./docker/certificates}
        target: /etc/nginx/tls
        read_only: true
      - type: bind
        source: ${DRIVEMPVD_ACME_WEBROOT_PATH:-./docker/acme-webroot}
        target: /var/www/certbot
        read_only: true

networks:
  edge:
  private:
    internal: true

volumes:
  postgres_data:
